# Add INSIDE the EXISTING server { listen 443 ssl; server_name huitaoz.top; }
# Check for an existing /cprg-312/ location before changing Nginx.
# Specific /api/ location must take precedence over Vue's static SPA rule.
location ^~ /cprg-312/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

